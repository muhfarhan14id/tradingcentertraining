<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanavyn Official – Trader</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="logo.png" alt="logo"><b>Lanavyn Official</b><span id="tfs"></span>
<label><input type="checkbox" id="ma" checked>MA</label><label><input type="checkbox" id="bb">BB</label><button id="no">+ New Order</button></header>
<main><aside><table id="mw"></table></aside><section><canvas id="cv"></canvas>
<div id="oc"><button class="s" id="qs">SELL</button><input id="qv" value="0.10"><button class="b" id="qb">BUY</button></div></section></main>
<div id="acc"></div><nav id="tabs"><a data-t="t" class="on">Trade</a><a data-t="h">History</a><a data-t="c">Risk Calc</a></nav><div id="tb"></div>
<footer>Lanavyn Official · Akun Standard 1:100 · Dana virtual untuk edukasi trading</footer>
<dialog id="dl"><h3>Order</h3><select id="os"></select><select id="ok"><option value="M">Market Execution</option><option value="L">Limit</option><option value="S">Stop</option></select>
<input id="ov" placeholder="Volume" value="0.10"><input id="op" placeholder="Harga (pending)"><input id="osl" placeholder="Stop Loss"><input id="otp" placeholder="Take Profit">
<div><button class="s" id="ds">Sell</button><button class="b" id="db">Buy</button><button id="dx">Batal</button></div></dialog>
<script src="app.js"></script></body></html>
